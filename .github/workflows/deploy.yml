name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # ─── Shared checks + frontend build ────────────────────────────────────────
  build:
    name: Type-check & build frontends
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Build frontends
        run: pnpm --filter partner --filter client --filter admin build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-builds
          path: |
            apps/partner/dist
            apps/client/dist
            apps/admin/dist
          retention-days: 1

  # ─── API → Railway ──────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        run: railway up --service ${{ vars.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─── Partner app → Vercel ───────────────────────────────────────────────────
  deploy-partner:
    name: Deploy partner to Vercel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-builds

      - name: Deploy to Vercel
        run: npx vercel deploy apps/partner/dist --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PARTNER }}

  # ─── Client app → Vercel ────────────────────────────────────────────────────
  deploy-client:
    name: Deploy client to Vercel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-builds

      - name: Deploy to Vercel
        run: npx vercel deploy apps/client/dist --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENT }}

  # ─── Admin app → Vercel ─────────────────────────────────────────────────────
  deploy-admin:
    name: Deploy admin to Vercel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-builds

      - name: Deploy to Vercel
        run: npx vercel deploy apps/admin/dist --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
